<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voter List Detective: Gadbad Nagar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d1b2e; --chalk:#fff6e0; --gold:#f4b41a; --red:#c7352a; --blue:#3a66d8; --green:#257a4a;
  --panel:#fff6e0; --panel-text:#1d1b2e; --muted:#5d5a70; --line:rgba(29,27,46,.2);
  --btn:#1d1b2e; --btn-text:#fff6e0; --focus:#3a66d8; --note:#fde7a1;
  --display:'Rozha One',Georgia,'Times New Roman',serif;
  --body:'Hind',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#26223b; --panel-text:#fff6e0; --muted:#b9b4cf; --line:rgba(255,246,224,.22);
    --btn:#f4b41a; --btn-text:#1d1b2e; --focus:#ffd36e; --note:#4a4020;
  }
}
:root[data-theme="dark"]{
  --panel:#26223b; --panel-text:#fff6e0; --muted:#b9b4cf; --line:rgba(255,246,224,.22);
  --btn:#f4b41a; --btn-text:#1d1b2e; --focus:#ffd36e; --note:#4a4020;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;font-family:var(--body);color:var(--panel-text);
  background:linear-gradient(#ffd98a,#ff9a6b 60%,#e8704f);transition:background 1s}
body.l2{background:linear-gradient(#f0825f,#8a4a7d 60%,#3a2a5a)}
body.l3{background:linear-gradient(#141838,#2a2255 60%,#4a2a5a)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:stretch;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none;z-index:5}
.chip{background:rgba(29,27,46,.78);color:#fff6e0;border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;
  font-weight:700;font-size:14px;line-height:1.2;min-width:0}
.chip small{font-weight:400;font-size:12px;opacity:.85}
.chip.mid{align-items:center}.chip.right{align-items:flex-end}
#pips{display:flex;gap:4px;margin-top:3px}
#pips i{width:12px;height:12px;border-radius:50%;border:2px solid #f4b41a;background:transparent;display:block}
#pips i.on{background:#f4b41a}

/* Speech bubbles */
#bubbles{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 62px);display:flex;flex-direction:column;gap:6px;
  pointer-events:none;z-index:4;max-width:430px}
.bub{margin:0;background:#fff6e0;color:#1d1b2e;border:2px solid #1d1b2e;border-radius:12px;padding:7px 10px;font-size:14px;line-height:1.3;
  width:fit-content;max-width:100%}
.bub b{font-family:var(--display);font-weight:400;margin-right:4px}
.bub.jim{align-self:flex-end;border-color:#c7352a;background:#ffe3df}
.bub[hidden]{display:none}

/* Docks (bottom sheets) */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--panel);color:var(--panel-text);border-radius:18px 18px 0 0;
  padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);box-shadow:0 -6px 24px rgba(0,0,0,.35);
  transform:translateY(110%);transition:transform .3s ease;max-height:64%;overflow:auto;z-index:6;visibility:hidden}
.dock.show{transform:none;visibility:visible}
@media (min-width:900px){
  .dock{left:auto;right:16px;top:74px;bottom:16px;width:390px;border-radius:18px;max-height:none;transform:translateX(115%)}
  .dock.show{transform:none}
  #bubbles{max-width:380px}
}

#timer{display:none;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
#timer.on{display:block}
#timerFill{height:100%;width:100%;background:var(--gold)}
#timerFill.low{background:var(--red)}
.caseno{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}

/* ID card */
.idcard{background:#fff6e0;color:#1d1b2e;border:2px solid #1d1b2e;border-radius:10px;padding:8px 10px;
  display:grid;grid-template-columns:78px 1fr;gap:6px 10px}
.idhead{grid-column:1/-1;font-family:var(--display);font-size:13px;border-bottom:1px solid rgba(29,27,46,.3);padding-bottom:3px}
.photo{width:78px;height:78px;border:2px solid #1d1b2e;border-radius:6px;overflow:hidden;background:#cfe3e0;align-self:start}
.photo svg{display:block;width:100%;height:100%}
.idcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:13px;line-height:1.3;align-content:start}
.idcard dt{color:#5d5a70}
.idcard dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.note{grid-column:1/-1;margin:0;background:#fde7a1;color:#1d1b2e;border-radius:6px;padding:5px 8px;font-size:13px;line-height:1.3;font-style:italic}

/* Actions */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.act{border:0;border-radius:10px;min-height:50px;padding:6px 4px;font:700 14px/1.15 var(--body);color:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center}
.act small{font-weight:600;font-size:11px;opacity:.92}
.act:active{transform:scale(.97)}
.act.clear{background:var(--green)}
.act.f7{background:var(--red)}
.act.f8{background:var(--gold);color:#1d1b2e}
.act.f6{background:var(--blue)}
.linkbtn{background:none;border:0;color:var(--panel-text);text-decoration:underline;font-size:13px;margin-top:8px;padding:6px 0;cursor:pointer;min-height:36px}
.ledger{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px;max-height:140px;overflow:auto}
.ledger[hidden]{display:none}
.ledger li{display:flex;gap:8px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:3px 6px}
.ledger svg{width:30px;height:30px;border-radius:4px;flex:none}
.ledger span{color:var(--muted)}

/* Result */
#result h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px}
#result h3.good{color:var(--green)} #result h3.bad{color:var(--red)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #result h3.good{color:#5fd495} :root:not([data-theme="light"]) #result h3.bad{color:#ff8c80}}
:root[data-theme="dark"] #result h3.good{color:#5fd495} :root[data-theme="dark"] #result h3.bad{color:#ff8c80}
#result p{margin:0 0 8px;font-size:15px;line-height:1.4}
#result .fact{border-left:4px solid var(--gold);padding-left:10px}
#result .tally{font-weight:700}
.primary{background:var(--btn);color:var(--btn-text);border:0;border-radius:12px;padding:12px 16px;font:700 16px var(--body);min-height:46px;width:100%;cursor:pointer}
.secondary{background:transparent;color:var(--panel-text);border:2px solid var(--panel-text);border-radius:12px;padding:10px 16px;font:700 15px var(--body);min-height:44px;width:100%;cursor:pointer;margin-top:8px}

/* Overlays */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,18,36,.55);z-index:20}
.overlay.show{display:flex}
.sheet{background:var(--panel);color:var(--panel-text);border-radius:16px;padding:20px;max-width:440px;width:100%;
  box-shadow:0 12px 40px rgba(0,0,0,.45);max-height:92%;overflow:auto}
.sheet h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;margin:0 0 10px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;margin:0 0 6px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 6px}
.sheet p{margin:0 0 12px;line-height:1.45;font-size:16px}
.sheet .small{font-size:13px;color:var(--muted)}
.sheet blockquote{margin:0 0 14px;padding:8px 12px;border-left:4px solid var(--red);background:var(--note);font-style:italic;border-radius:0 8px 8px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.stats div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:22px;color:var(--panel-text);font-family:var(--display);font-weight:400}
.track{position:relative;height:34px;border:2px solid var(--panel-text);border-radius:8px;margin:12px 0 14px;overflow:hidden;background:var(--line)}
.zone2{position:absolute;left:28%;width:44%;top:0;bottom:0;background:rgba(37,122,74,.35)}
.zone{position:absolute;left:40%;width:20%;top:0;bottom:0;background:#257a4a}
.mark{position:absolute;top:0;bottom:0;width:8px;margin-left:-4px;background:#c7352a;border-radius:3px}
.stampmsg{min-height:22px;font-weight:700;margin:0 0 8px}
.sharebox{font-size:14px;background:var(--note);border-radius:8px;padding:8px 10px;margin:0 0 10px;overflow-wrap:anywhere}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.legend span{font-size:12.5px;font-weight:700;color:#fff;padding:3px 8px;border-radius:999px}
.legend .a{background:var(--red)}.legend .b{background:var(--gold);color:#1d1b2e}.legend .c{background:var(--blue)}
.nogl{position:fixed;left:12px;right:12px;top:120px;background:#fff6e0;color:#1d1b2e;border:2px solid #1d1b2e;padding:10px;border-radius:10px;z-index:3;font-size:14px}
.mutebtn{pointer-events:auto;background:rgba(29,27,46,.78);color:#fff;border:0;border-radius:10px;width:40px;font-size:18px;cursor:pointer;flex:none}
.primary:disabled{opacity:.45;cursor:not-allowed}
.sheet .fact{border-left:4px solid var(--gold);padding-left:10px}
.issues{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.issuebtn{display:flex;flex-direction:column;gap:3px;text-align:left;background:transparent;color:var(--panel-text);border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;cursor:pointer;min-height:44px}
.issuebtn b{font-family:var(--display);font-weight:400;font-size:18px}
.issuebtn span{font-size:12.5px;color:var(--muted);line-height:1.3}
#vote h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 4px}
#vote .sub{margin:0 0 8px;font-size:13.5px;color:var(--muted);line-height:1.35}
.cands{display:grid;gap:6px;margin:0 0 8px}
.cand{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;align-items:center;text-align:left;width:100%;background:transparent;color:var(--panel-text);border:2px solid var(--line);border-radius:12px;padding:8px;font:inherit;cursor:pointer}
.cand[aria-pressed="true"]{border-color:var(--gold);background:var(--note)}
.cand .fc{width:44px;height:44px;border-radius:8px;overflow:hidden;grid-row:1/3;align-self:start}
.fc svg{display:block;width:100%;height:100%}
.cand b{font-size:14px}
.cand small{display:block;color:var(--muted);font-size:12px}
.cand .pr{grid-column:2/4;font-size:13.5px;line-height:1.3;margin:0}
.meter{display:flex;gap:2px;align-items:flex-end;height:18px}
.meter i{width:6px;border-radius:2px;background:var(--line);display:block}
.meter i.on{background:var(--green)}
#castWrap{position:sticky;bottom:0;background:var(--panel);padding-top:6px}
#result details{margin:0 0 8px;font-size:14px}
#result summary{cursor:pointer;font-weight:700;margin-bottom:6px;min-height:32px}
#hud{gap:6px}
.chip{padding:6px 8px;font-size:13px}
.bub small{display:block;opacity:.8;font-size:12px}
.langrow{display:flex;gap:6px;margin:12px 0 0}
.langrow button{flex:1;min-height:40px;border:2px solid var(--line);background:transparent;color:var(--panel-text);border-radius:10px;font:600 14px var(--body);cursor:pointer}
.langrow button[aria-pressed="true"]{border-color:var(--gold);background:var(--note)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.badge{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;opacity:.6}
.badge.on{opacity:1;border-color:var(--gold);background:var(--note)}
.badge svg{width:40px;height:40px}
.badge b{font-size:14px;line-height:1.2}
.badge span{font-size:12px;color:var(--muted);line-height:1.3}
.badge small{font-size:11.5px;font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="l1">
<canvas id="scene" aria-hidden="true"></canvas>

<header id="hud">
  <div class="chip"><span id="rank">Trainee Clerk</span><small id="lvl">Level 1 of 3</small></div>
  <div class="chip mid"><small>Reputation</small><span id="pips" role="img" aria-label="Reputation 5 of 5"></span></div>
  <div class="chip right"><span id="score">0</span><small id="streak">Streak 0</small></div>
  <button id="mute" class="mutebtn" aria-label="Sound on">🔊</button>
  <button id="lang" class="mutebtn" aria-label="Language" style="font-size:14px;font-weight:700">EN</button>
</header>

<div id="bubbles">
  <p id="tota" class="bub" aria-live="polite" hidden></p>
  <p id="jim" class="bub jim" hidden></p>
</div>

<section id="panel" class="dock" aria-label="Current voter">
  <div id="timer"><div id="timerFill"></div></div>
  <p id="caseno" class="caseno"></p>
  <div id="card"></div>
  <div class="actions" id="actions">
    <button class="act clear" data-c="ok">Clear<small>Looks genuine</small></button>
    <button class="act f7" data-c="dup">Duplicate<small>Form 7</small></button>
    <button class="act f7" data-c="dead">Deceased<small>Form 7</small></button>
    <button class="act f7" data-c="ghost">Not a person<small>Form 7</small></button>
    <button class="act f8" data-c="addr">Wrong address<small>Form 8</small></button>
    <button class="act f6" data-c="new">Not on roll<small>Form 6</small></button>
  </div>
  <button id="ledgerBtn" class="linkbtn" aria-expanded="false" aria-controls="ledger">Roll so far (0)</button>
  <ul id="ledger" class="ledger" hidden></ul>
</section>

<section id="result" class="dock" aria-live="polite"></section>
<section id="vote" class="dock" aria-label="Candidates"></section>
<div id="stamp" class="overlay"></div>
<div id="modal" class="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var $ = function(id){ return document.getElementById(id); };
var pick = function(a){ return a[Math.floor(Math.random()*a.length)]; };
var SPD = RM ? 0.4 : 1;

/* ---------- game data ---------- */
var SK = ['#f3cfa6','#dca878','#b9814f','#8f5b39'];
function F(skin, shirt, hat, o){ return Object.assign({skin:SK[skin], shirt:shirt, hat:hat}, o||{}); }

var LABEL = {
  ok:'a genuine voter', dup:'a duplicate entry', dead:'a deceased voter',
  ghost:'a ghost entry (not a real person)', addr:'a wrong address', 'new':'a voter missing from the roll'
};
var FORM = { dup:7, dead:7, ghost:7, addr:8, 'new':6 };
var FORMTXT = {
  7:'Form 7 is used to object to an entry on the roll.',
  8:'Form 8 is used to correct details or change an address.',
  6:'Form 6 is used to register as a new voter.'
};

var ramesh = F(1,'#c8541a','none',{stache:1});
var pappu  = F(2,'#e07a20','none',{stache:1});
var anita  = F(1,'#c2185b','none',{long:1});

var LEVELS = [
 { title:'The Roll Room', timer:0,
   intro:'Gadbad Nagar\u2019s voter roll is a mess. Check every voter who walks up. Genuine? Clear them. Something off? Flag it and file the right form.',
   jimmy:'Relax, Inspector. What could go wrong? Trust me, yaar.',
   cases:[
    {n:'Savita Deshmukh', f:'W/o Raghunath Deshmukh', age:34, addr:'12, Neem Gali', no:'GN-0114',
     note:'Arrived with her own pen. Suspiciously organised.', t:'ok', face:F(1,'#2f6f73','none',{long:1}),
     line:'Clean as a freshly washed steel tumbler. Nothing wrong here.',
     fact:'Most entries on a roll are genuine. Flagging a real voter is as serious as missing a fake one.'},
    {n:'Bhola Prasad', f:'S/o Late Shiv Prasad', age:121, addr:'3, Mill Road', no:'GN-0066',
     note:'The ration shop says he still collects wheat. His WhatsApp status says online.', t:'dead', j:1,
     face:F(3,'#8a8a8a','topi',{stache:1}),
     line:'Born before the telegraph, apparently still very active on WhatsApp. Jimmy forgot to update the roll.',
     fact:'Form 7 lets people raise an objection to an entry, such as a deceased voter. Officers verify before anything is removed.'},
    {n:'Ramesh Kumar', f:'S/o Suresh Kumar', age:45, addr:'7, Peepal Chowk', no:'GN-0231',
     note:'Proud owner of a magnificent moustache.', t:'ok', face:ramesh,
     line:'A genuine voter with a genuine moustache. Remember his face, you will see it again.',
     fact:'Use the roll so far list at the bottom. Duplicates show up as the same person entered twice.'},
    {n:'Rmesh Kumar', f:'S/o Suresh Kumar', age:45, addr:'7, Peepal Chowk', no:'GN-0877',
     note:'The moustache looks freshly stuck on. Slightly crooked.', t:'dup', j:1,
     face:Object.assign({}, ramesh, {fake:1}),
     line:'One missing letter, one crooked moustache, same man. Jimmy is not great at disguises.',
     fact:'A person should appear on the roll only once. Duplicate entries are objected to with Form 7.'},
    {n:'Gudiya Verma', f:'D/o Anil Verma', age:29, addr:'House No. 1, Behind the Big Banyan Tree', no:'GN-0402',
     note:'Fourteen other voters share this address. The banyan tree has not been consulted.', t:'addr',
     face:F(2,'#d63c2f','none',{long:1}),
     line:'Fourteen voters, one tree. Not every error is fraud. Sometimes the roll simply needs fixing.',
     fact:'Form 8 is for correcting details, or changing your address within the same constituency.'},
    {n:'Aarav Joshi', f:'S/o Mahesh Joshi', age:19, addr:'5, Kabir Lane', no:'\u2014',
     note:'Not found on the roll. Has been waiting since his 18th birthday.', t:'new',
     face:F(0,'#3a66d8','cap'),
     line:'Eligible, enthusiastic, and missing from the list. No villain here, just a gap.',
     fact:'Form 6 is for new voters who have turned 18. It can be filed online too.'},
    {n:'Farida Khan', f:'D/o Salim Khan', age:36, addr:'19, Rose Garden Lane', no:'GN-0290',
     note:'Has a spreadsheet of every deadline. Even yours.', t:'ok', face:F(1,'#2f6f73','none',{long:1}),
     line:'Organised, genuine and slightly intimidating. Cleared.',
     fact:'Checking your own entry on the roll before an election avoids last-minute surprises.'}
   ]},
 { title:'Jimmy\u2019s Disguises', timer:0,
   intro:'Jimmy is back with new tricks. Twins, lookalikes and a few entries that are not even people. Be careful: some strange cases are perfectly real.',
   jimmy:'New hat, new glasses, same old me!',
   cases:[
    {n:'Asha Kulkarni', f:'D/o Vinayak Kulkarni', age:23, addr:'Flat 2, Lakeview Heights', no:'\u2014',
     note:'Moved to Gadbad Nagar from another city a month ago. Her old voter card is still in her old city.', t:'new',
     face:F(1,'#c8541a','none',{long:1}),
     line:'New town, same voter, no entry here yet. A fresh start, not a fraud.',
     fact:'Moved to a different constituency? File Form 6 in the place where you now live.'},
    {n:'Mohan Lal', f:'S/o Gopal Lal', age:38, addr:'3, Mill Road, Gadbad Nagar', no:'GN-0310',
     note:'Runs the bicycle shop on the corner. Fixed your tyre last week.', t:'ok', face:F(1,'#e0a100','topi'),
     line:'An honest voter with an honest puncture repair business.',
     fact:'Knowing a voter personally is not a reason to clear or flag anyone. Check the card.'},
    {n:'Pappu Singh', f:'S/o Hari Singh', age:52, addr:'22, Station Road', no:'GN-0488',
     note:'Wears the same orange shirt every election.', t:'ok', face:pappu,
     line:'Genuine. Note that face and that shirt for later.',
     fact:'Comparing details like the relative\u2019s name, age and photo is how duplicates are found.'},
    {n:'Kamala Bai', f:'W/o Late Ganesh Bai', age:96, addr:'9, Temple Lane', no:'GN-0099',
     note:'Neighbours attended the funeral last monsoon. Her cup at the corner shop was retired with honours.', t:'dead', j:1,
     face:F(1,'#c9c9c9','none',{long:1}),
     line:'Gone, but still on the roll. Jimmy hoped nobody would look.',
     fact:'Deaths are registered with the local registrar. A death certificate helps the officer verify an objection.'},
    {n:'Sohan Lal', f:'S/o Gopal Lal', age:38, addr:'3, Mill Road, Gadbad Nagar', no:'GN-0311',
     note:'Twin of Mohan Lal, born four minutes later. Insists he is the handsome one.', t:'ok', face:F(1,'#2f6f73','cap'),
     line:'Twins! Same father, same birthday, different human. A trap for the trigger-happy.',
     fact:'Look at the whole picture before flagging. Similar details do not always mean a duplicate.'},
    {n:'Pappu Sing', f:'S/o Hari Singh', age:52, addr:'22, Station Road', no:'GN-0902',
     note:'Wearing cardboard glasses. Looks like Pappu Singh with a cold.', t:'dup', j:1,
     face:Object.assign({}, pappu, {glasses:1}),

function audioInit(){

    if (AC && AC.state === 'suspended') AC.resume();

function tone(f, d, type, vol, delay, slide){
  if (!AC || muted) return;
  try {
    var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.05);
  } catch(e){}
}

    winB.color.set(t.night===2 ? '#343a66' : (t.night===1 ? '#ffd36e' : '#9fb8b4'));
    bulbMats.forEach(function(m){ m.color.set(t.night ? '#fff2b0' : '#e8dcae'); });
  },
  enter:function(c, cb){
    if (!GL) { setTimeout(cb, 200); return; }
    var g = c.kind==='lamp' ? makeLampChar() : (c.kind==='scarecrow' ? makeScarecrow() : makePerson(c.face));
    g.position.set(8,0,2.5); g.rotation.y = -Math.PI/2; g.userData.walk = true;
    scene.add(g); chars.push(g); cur3d = g;
    tween(1.5, function(p){ g.position.x = 8*(1-p); }, function(){
      g.userData.walk = false; g.position.y = 0;
      tween(0.25, function(p){ g.rotation.y = -Math.PI/2*(1-p); }, cb);
    });
  },
  exit:function(kind){
    if (!GL || !cur3d) return;
    var g = cur3d; cur3d = null;
    function remove(){ scene.remove(g); var i = chars.indexOf(g); if (i>-1) chars.splice(i,1); }
    if (kind === 'poof') {
      tween(0.7, function(p){ g.position.y = Math.sin(p*Math.PI)*1.3; g.rotation.y = p*Math.PI*4; g.scale.setScalar(Math.max(0.02,1-p*0.97)); }, remove);
    } else {
      g.rotation.y = -Math.PI/2; g.userData.walk = true;
      var x0 = g.position.x;
      tween(1.3, function(p){ g.position.x = x0 - 9*p; }, remove);
    }
  },
  jimmyReset:function(){ if(!GL) return; jimmy.visible = true; jimmy.userData.offX = 0; jimmy.userData.walk = false; jimmy.position.y = 0; },
  jimmyCatch:function(){ if(!GL) return; tween(0.6, function(p){ jimmy.userData.shake = Math.sin(p*Math.PI*8)*0.25*(1-p); }, function(){ jimmy.userData.shake = 0; }); },
  jimmyWin:function(){ if(!GL) return; tween(0.9, function(p){ jimmy.position.y = Math.abs(Math.sin(p*Math.PI*3))*0.8; jimmy.rotation.z = Math.sin(p*Math.PI*6)*0.15; }, function(){ jimmy.position.y = 0; jimmy.rotation.z = 0; }); },
  jimmyFlee:function(){ if(!GL) return; jimmy.userData.walk = true; tween(2.2, function(p){ jimmy.userData.offX = -12*p; }, function(){ jimmy.userData.walk = false; jimmy.visible = false; }); },
  hop:function(){ if(!GL) return; tween(0.5, function(p){ parrot.position.y = 0.1 + Math.sin(p*Math.PI)*0.6; }, function(){ parrot.position.y = 0.1; }); }
};

/* ---------- main loop ---------- */
var last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  var dt = Math.min((now-last)/1000, 0.1); last = now; time += dt;

  for (var i=tweens.length-1; i>=0; i--){
    var tw = tweens[i]; tw.t += dt;
    var p = Math.min(tw.t/tw.dur, 1);
    tw.fn(ease(p));
    if (p >= 1){ tweens.splice(i,1); if (tw.done) tw.done(); }
  }

  if (S.timerOn){
    S.tLeft -= dt;
    var cap = LEVELS[S.lvl].timer;
    var fill = $('timerFill');
    fill.style.width = Math.max(0, S.tLeft/cap*100) + '%';
    fill.className = S.tLeft < 5 ? 'low' : '';
    if (S.tLeft <= 0){ S.tLeft = 0; decide('timeout'); }
  }

  if (!GL) return;
  chars.forEach(function(g){
    var legs = g.userData.legs;
    if (g.userData.walk){
      if (legs){ legs[0].rotation.x = Math.sin(time*10)*0.6; legs[1].rotation.x = -Math.sin(time*10)*0.6; g.position.y = Math.abs(Math.sin(time*10))*0.06; }
      else if (g.userData.hop){ g.position.y = Math.abs(Math.sin(time*8))*0.25; }
    } else if (legs){ legs[0].rotation.x *= 0.8; legs[1].rotation.x *= 0.8; }
  });
  jimmy.position.x = jimmy.userData.baseX + jimmy.userData.offX + jimmy.userData.shake;
  if (!jimmy.userData.walk && !RM) jimmy.rotation.y = Math.sin(time*1.1)*0.3 + 0.35;
  else if (jimmy.userData.walk) jimmy.rotation.y = -Math.PI/2;
  if (!RM) parrot.rotation.z = Math.sin(time*2)*0.04;

  var sway = RM ? 0 : (Math.sin(time*0.3)*0.25 + px*0.6);
  camera.position.set(sway, 2.2, 9);
  camera.lookAt(0, camera.userData.ty, 0);
  renderer.render(scene, camera);
}

  var o = '<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';

    o += '<rect width="80" height="80" fill="#cfe3e0"/><rect x="37" y="30" width="6" height="50" fill="#3b3b4a"/>' +

         '<path d="M22 24 L16 22 M58 24 L64 22 M40 6 L40 1" stroke="#e0a100" stroke-width="2" fill="none"/>';
  } else if (c.kind === 'scarecrow'){
    o += '<rect width="80" height="80" fill="#e8d8a8"/><rect x="38" y="30" width="4" height="50" fill="#6a4a2a"/>' +
         '<rect x="10" y="40" width="60" height="4" fill="#6a4a2a"/><rect x="26" y="42" width="28" height="26" fill="#b5442f"/>' +

         '<circle cx="35" cy="28" r="1.8" fill="#161616"/><circle cx="45" cy="28" r="1.8" fill="#161616"/>';
  } else {
    var f = c.face;
    o += '<rect width="80" height="80" fill="#cfe3e0"/>';
    if (f.long) o += '<ellipse cx="40" cy="40" rx="20" ry="26" fill="#161616"/>';

         '<rect x="34" y="48" width="12" height="10" fill="' + f.skin + '"/>' +
         '<circle cx="40" cy="36" r="16" fill="' + f.skin + '"/>';
    if (!f.hat || f.hat === 'none') o += '<path d="M24 34 Q24 16 40 16 Q56 16 56 34 Q48 24 40 24 Q32 24 24 34Z" fill="#161616"/>';
    else if (f.hat === 'topi') o += '<path d="M25 28 L27 16 Q40 12 53 16 L55 28 Q40 23 25 28Z" fill="#f5f5f5" stroke="#999" stroke-width="1"/>';
    else if (f.hat === 'turban') o += '<ellipse cx="40" cy="22" rx="19" ry="11" fill="#e0a100" stroke="#a87800" stroke-width="1.5"/>';
    else if (f.hat === 'cap') o += '<path d="M24 30 Q26 12 40 12 Q54 12 56 30Z" fill="' + f.shirt + '"/><rect x="40" y="28" width="22" height="4" rx="2" fill="' + f.shirt + '"/>';
    o += '<circle cx="34" cy="36" r="1.8" fill="#161616"/><circle cx="46" cy="36" r="1.8" fill="#161616"/>';

  }
  return o + '</svg>';
}

/* ---------- game flow ---------- */
function startGame(){
  LEVELS = STORY; S.mode = 'story'; stage.clearLineup();
  S.score = 0; S.rep = 5; S.combo = 0; S.caught = 0; S.total = 0; S.correctAll = 0;
  startLevel(0);
}

function startLevel(i){
  S.lvl = i; S.idx = 0; S.ledger = []; S.lvlCorrect = 0; S.lvlJCaught = 0; S.locked = true;
  S.lvlJ = LEVELS[i].cases.filter(function(c){ return c.j; }).length;
  document.body.className = 'l' + (i+1);
  stage.setLevel(i+1); stage.jimmyReset(); stage.disguise(S.mode === 'daily' ? 3 : S.lvl*2); updateHUD(); renderLedger();
  var L = LEVELS[i];
  showModal('<h2>' + (S.mode === 'daily' ? '' : 'Level ' + (i+1) + ' of 3: ') + L.title + '</h2><p>' + L.intro + '</p><blockquote>' + L.jimmy + '<br><small>Jugaadu Jimmy, your best friend</small></blockquote><button class="primary" id="go">Open the roll</button>',
    function(){ $('go').onclick = function(){ hideModal(); jimSay(L.jimmy); nextCase(); }; });
}

function nextCase(){
  $('result').classList.remove('show');
  var L = LEVELS[S.lvl], c = L.cases[S.idx];
  S.cur = c; S.locked = true; S.timerOn = false;
  stage.enter(c, function(){
    $('caseno').textContent = 'Voter ' + (S.idx+1) + ' of ' + L.cases.length;
    $('card').innerHTML = cardHTML(c);
    renderLedger();
    $('ledger').hidden = true; $('ledgerBtn').setAttribute('aria-expanded','false');
    $('timer').className = L.timer ? 'on' : '';
    $('timerFill').style.width = '100%'; $('timerFill').className = '';
    $('panel').classList.add('show');
    S.locked = false;
    if (L.timer){ S.tLeft = L.timer; S.timerOn = true; }
  });
}

function decide(choice){
  if (S.locked) return;
  S.locked = true; S.timerOn = false;
  var c = S.cur, right = (choice === c.t), isFlag = (choice !== 'ok' && choice !== 'timeout');
  $('panel').classList.remove('show');
  if (right && isFlag) openStamp(c, function(bonus){ finish(choice, right, bonus); });
  else finish(choice, right, 0);
}

function finish(choice, right, bonus){
  var c = S.cur, L = LEVELS[S.lvl], pts = 0, loss = 0, head = '';
  S.total++;
  if (right){
    S.combo = Math.min(S.combo+1, 6);
    var tb = L.timer ? Math.round(S.tLeft*4) : 0;
    pts = 100 + (S.combo-1)*10 + bonus + tb;
    S.score += pts; S.lvlCorrect++; S.correctAll++;
    head = (choice === 'ok') ? 'Cleared. Correct!' : 'Caught it!';
    if (c.j){ S.lvlJCaught++; S.caught++; sfx.catchj(); stage.jimmyCatch(); statCatch(); jimSay(pick(CATCH), 'New disguise: ' + stage.disguise((S.mode === 'daily' ? 3 : S.lvl*2) + S.lvlJCaught)); }
    stage.exit(choice === 'ok' ? 'walk' : 'poof');
    sfx.good(); say(pick(choice === 'ok' ? TOTA_OK : TOTA_GOOD));
  } else {
    S.combo = 0;
    sfx.bad(); if (choice === 'timeout'){ head = 'Time is up!'; loss = 1; say('Squawk! The clock won that round.'); stage.exit('walk'); }
    else if (choice === 'ok'){ head = 'That one slipped through.'; loss = 1; stage.exit('walk'); say(pick(TOTA_BAD)); if (c.j){ sfx.jimmy(); stage.jimmyWin(); jimSay(pick(WIN)); } }
    else if (c.t === 'ok'){ head = 'You flagged a real voter.'; loss = 1; stage.exit('walk'); say('You just flagged a real voter. Squawk of shame.'); }
    else { head = 'Right instinct, wrong flag.'; stage.exit('walk'); say(pick(TOTA_BAD)); }
  }
  S.rep = Math.max(0, S.rep - loss); awardCheck();
  updateHUD();
  if (choice === 'ok' || choice === 'dup' || choice === 'timeout' || true){
    if (c.t === 'ok' || c.t === 'dead' || c.t === 'addr') S.ledger.push(c);
  }

  var tally = '';
  if (right){
    tally = '+' + pts + ' points' + (bonus ? ' (stamp bonus +' + bonus + ')' : '') + (L.timer ? ', speed bonus included' : '');
    if (choice !== 'ok') tally = 'Form ' + FORM[c.t] + ' filed. ' + tally;
  }
  if (loss) tally += (tally ? ' ' : '') + 'Reputation \u22121.';
  var intro = right ? '' : '<p><b>This one was ' + LABEL[c.t] + '.</b></p>';
  var last = (S.idx >= L.cases.length - 1) || S.rep <= 0;
  $('result').innerHTML = '<h3 class="' + (right ? 'good' : 'bad') + '">' + head + '</h3>' + intro +
    '<p>' + cf(c, 'line') + '</p><p class="fact"><b>In real life:</b> ' + cf(c, 'fact') + '</p>' +
    (tally ? '<p class="tally">' + tally + '</p>' : '') +
    '<button class="primary" id="nextBtn">' + (last ? 'See results' : 'Next voter') + '</button>';
  $('result').classList.add('show');
  var nb = $('nextBtn'); nb.focus();
  nb.onclick = function(){
    $('result').classList.remove('show');
    if (S.rep <= 0) return endGame(false);
    S.idx++;
    if (S.idx >= L.cases.length) return endLevel();
    nextCase();
  };
}

function keyOf(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function seedFrom(str){ var h = 2166136261; for (var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffled(arr, r){ var a = arr.slice(); for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function buildDaily(){
  var key = keyOf(new Date()), r = rng(seedFrom(key));
  var sets = shuffled(DAILY_J, r).slice(0,2).concat(shuffled(DAILY_HON, r).slice(0,1), shuffled(DAILY_OK, r).slice(0,2));
  sets = shuffled(sets, r);
  var cases = []; sets.forEach(function(s){ cases = cases.concat(s); });
  return { title:'Daily Case File, ' + key, timer:0,
    intro:'Everyone gets the same voters today. Catch Jimmy\u2019s fakes, spare the genuine ones, and keep your streak alive.',
    jimmy:'A fresh day, a fresh disguise. Trust me, yaar.', cases:cases };
}

function startDaily(){
  LEVELS = [buildDaily()]; S.mode = 'daily';
  S.score = 0; S.rep = 5; S.combo = 0; S.caught = 0; S.total = 0; S.correctAll = 0;

  if (win && rec.last !== key){ rec.streak = (rec.last === keyOf(y)) ? (rec.streak||0) + 1 : 1; rec.last = key; }

 'Savita Deshmukh|GN-0114':{hl:'Apni pen saath laayi thi. Shak ki had tak organised.##Steel ke dhule gilaas jaisi saaf. Yahan kuch galat nahi.##List ki zyadatar entries asli hoti hain. Asli voter ko flag karna utna hi gambhir hai jitna nakli ko chhod dena.',hi:'अपना पेन साथ लाई थीं। शक की हद तक सुव्यवस्थित।##धुले हुए स्टील के गिलास जैसी साफ़। यहाँ कुछ ग़लत नहीं।##सूची की ज़्यादातर प्रविष्टियाँ असली होती हैं। असली मतदाता को चिह्नित करना उतना ही गंभीर है जितना नकली को छोड़ देना।'},
 'Bhola Prasad|GN-0066':{hl:'Ration dukaan kehti hai ki wo ab bhi gehun lete hain. Unka WhatsApp status online dikhata hai.##Telegraph se pehle paida hue, aur lagta hai WhatsApp par ab bhi bahut active. Jimmy list update karna bhool gaya.##Form 7 se kisi bhi entry par aapatti uthayi ja sakti hai, jaise mrit voter. Adhikari jaanch ke baad hi kuch hatate hain.',hi:'राशन की दुकान कहती है कि वे अब भी गेहूँ लेते हैं। उनका व्हाट्सऐप स्टेटस ऑनलाइन दिखाता है।##टेलीग्राफ़ से पहले जन्मे, और लगता है व्हाट्सऐप पर अब भी बहुत सक्रिय। जिम्मी सूची अपडेट करना भूल गया।##फ़ॉर्म 7 से किसी भी प्रविष्टि पर आपत्ति उठाई जा सकती है, जैसे मृत मतदाता। अधिकारी जाँच के बाद ही कुछ हटाते हैं।'},
 'Ramesh Kumar|GN-0231':{hl:'Shaandaar moonchon ke garvit maalik.##Asli voter, asli moonch. Uska chehra yaad rakhiye, aap use phir dekhenge.##Neeche ki "Ab tak ki list" use kijiye. Duplicate wahi insaan hota hai jo do baar likha gaya ho.',hi:'शानदार मूँछों के गर्वित मालिक।##असली मतदाता, असली मूँछ। उसका चेहरा याद रखिए, आप उसे फिर देखेंगे।##नीचे की "अब तक की सूची" का इस्तेमाल कीजिए। दोहरी प्रविष्टि वही इंसान होता है जो दो बार लिखा गया हो।'},
 'Rmesh Kumar|GN-0877':{hl:'Moonch abhi-abhi chipkayi hui lagti hai. Thodi tedhi.##Ek akshar kam, ek tedhi moonch, wahi aadmi. Jimmy bhes badalne mein achha nahi hai.##Ek insaan list mein sirf ek baar hona chahiye. Duplicate entries par Form 7 se aapatti ki jaati hai.',hi:'मूँछ अभी-अभी चिपकाई हुई लगती है। थोड़ी टेढ़ी।##एक अक्षर कम, एक टेढ़ी मूँछ, वही आदमी। जिम्मी भेस बदलने में अच्छा नहीं है।##एक इंसान सूची में सिर्फ़ एक बार होना चाहिए। दोहरी प्रविष्टियों पर फ़ॉर्म 7 से आपत्ति की जाती है।'},
 'Gudiya Verma|GN-0402':{hl:'Chaudah aur voter isi pate par hain. Bargad ke ped se poochha nahi gaya.##Chaudah voter, ek ped. Har galti dhokha nahi hoti. Kabhi-kabhi list bas sudharni hoti hai.##Form 8 se details sudhari jaati hain, ya usi nirvachan kshetra mein pata badla jaata hai.',hi:'चौदह और मतदाता इसी पते पर हैं। बरगद के पेड़ से पूछा नहीं गया।##चौदह मतदाता, एक पेड़। हर ग़लती धोखा नहीं होती। कभी-कभी सूची को बस सुधारना होता है।##फ़ॉर्म 8 से जानकारी सुधारी जाती है, या उसी निर्वाचन क्षेत्र में पता बदला जाता है।'},
 'Aarav Joshi|—':{hl:'List mein nahi mila. 18wen janmdin se intezaar kar raha hai.##Yogya, utsahit, aur list se gayab. Yahan koi villain nahi, bas ek kami hai.##Form 6 un naye voters ke liye hai jo 18 saal ke ho chuke hain. Ise online bhi bhara ja sakta hai.',hi:'सूची में नहीं मिला। 18वें जन्मदिन से इंतज़ार कर रहा है।##योग्य, उत्साही, और सूची से ग़ायब। यहाँ कोई खलनायक नहीं, बस एक कमी है।##फ़ॉर्म 6 उन नए मतदाताओं के लिए है जो 18 साल के हो चुके हैं। इसे ऑनलाइन भी भरा जा सकता है।'},
 'Farida Khan|GN-0290':{hl:'Har deadline ki spreadsheet hai. Aapki bhi.##Sangathit, asli aur thodi daraavni. Clear.##Chunaav se pehle list mein apni entry khud dekh lene se aakhri pal ki pareshani nahi hoti.',hi:'हर समय-सीमा की स्प्रेडशीट है। आपकी भी।##सुव्यवस्थित, असली और थोड़ी डरावनी। मंज़ूर।##चुनाव से पहले सूची में अपनी प्रविष्टि खुद देख लेने से आख़िरी पल की परेशानी नहीं होती।'},
 'Asha Kulkarni|—':{hl:'Ek mahine pehle doosre shehar se Gadbad Nagar aayi. Purana voter card purane shehar mein hi hai.##Naya shehar, wahi voter, yahan abhi entry nahi. Nayi shuruaat, dhokha nahi.##Kisi doosre nirvachan kshetra mein gaye? Jahan ab rehte hain wahan Form 6 bharo.',hi:'एक महीने पहले दूसरे शहर से गड़बड़ नगर आईं। पुराना मतदाता कार्ड पुराने शहर में ही है।##नया शहर, वही मतदाता, यहाँ अभी प्रविष्टि नहीं। नई शुरुआत, धोखा नहीं।##किसी दूसरे निर्वाचन क्षेत्र में चले गए? जहाँ अब रहते हैं वहाँ फ़ॉर्म 6 भरिए।'},
 'Mohan Lal|GN-0310':{hl:'Kone par cycle ki dukaan chalate hain. Pichhle hafte aapka tyre theek kiya.##Imaandaar voter, imaandaar puncture ki dukaan.##Kisi ko vyaktigat roop se jaanna use clear ya flag karne ki wajah nahi hai. Card dekhiye.',hi:'कोने पर साइकिल की दुकान चलाते हैं। पिछले हफ़्ते आपका टायर ठीक किया।##ईमानदार मतदाता, ईमानदार पंक्चर की दुकान।##किसी को व्यक्तिगत रूप से जानना उसे मंज़ूर या चिह्नित करने की वजह नहीं है। कार्ड देखिए।'},
 'Pappu Singh|GN-0488':{hl:'Har chunaav mein wahi narangi shirt pehente hain.##Asli. Us chehre aur us shirt ko baad ke liye yaad rakhiye.##Rishtedaar ka naam, umar aur photo jaisi baatein milakar hi duplicate pakde jaate hain.',hi:'हर चुनाव में वही नारंगी कमीज़ पहनते हैं।##असली। उस चेहरे और उस कमीज़ को बाद के लिए याद रखिए।##संबंधी का नाम, उम्र और फ़ोटो जैसी बातें मिलाकर ही दोहरी प्रविष्टियाँ पकड़ी जाती हैं।'},
 'Kamala Bai|GN-0099':{hl:'Padosiyon ne pichhli barsaat mein antim sanskar mein shirkat ki. Nukkad ki dukaan par unka cup sammaan ke saath retire ho gaya.##Chali gayin, par list mein abhi bhi hain. Jimmy ko bharosa tha ki koi dekhega nahi.##Mrityu sthaniya registrar ke paas darj hoti hai. Mrityu praman patra se adhikari ko Form 7 aapatti jaanchne mein madad milti hai.',hi:'पड़ोसियों ने पिछली बरसात में अंतिम संस्कार में शिरकत की। नुक्कड़ की दुकान पर उनका कप सम्मान के साथ सेवानिवृत्त हो गया।##चली गईं, पर सूची में अब भी हैं। जिम्मी को भरोसा था कि कोई देखेगा नहीं।##मृत्यु स्थानीय रजिस्ट्रार के पास दर्ज होती है। मृत्यु प्रमाण पत्र से अधिकारी को फ़ॉर्म 7 की आपत्ति जाँचने में मदद मिलती है।'},
 'Sohan Lal|GN-0311':{hl:'Mohan Lal ka judwa, chaar minute baad paida hua. Maanta hai ki wahi smart hai.##Judwa! Wahi pita, wahi janmdin, alag insaan. Jaldbaazi karne walon ke liye jaal.##Flag karne se pehle poori tasveer dekhiye. Milti-julti details ka matlab hamesha duplicate nahi hota.',hi:'मोहन लाल का जुड़वाँ, चार मिनट बाद जन्मा। मानता है कि वही स्मार्ट है।##जुड़वाँ! वही पिता, वही जन्मदिन, अलग इंसान। जल्दबाज़ी करने वालों के लिए जाल।##चिह्नित करने से पहले पूरी तस्वीर देखिए। मिलती-जुलती जानकारी का मतलब हमेशा दोहरी प्रविष्टि नहीं होता।'},
 'Pappu Sing|GN-0902':{hl:'Gatte ke chashme pehne hain. Zukaam wale Pappu Singh jaise lagte hain.##Wahi chehra, wahi shirt, bilkul naye chashme. Jimmy ne apna hi bhes dobara use kiya.##Duplicate entries par Form 7 se aapatti ki ja sakti hai taaki ek insaan do baar vote na de.',hi:'गत्ते के चश्मे पहने हैं। ज़ुकाम वाले पप्पू सिंह जैसे लगते हैं।##वही चेहरा, वही कमीज़, बिल्कुल नए चश्मे। जिम्मी ने अपना ही भेस दोबारा इस्तेमाल किया।##दोहरी प्रविष्टियों पर फ़ॉर्म 7 से आपत्ति की जा सकती है ताकि एक इंसान दो बार वोट न दे।'},
 'Bijli Khamba|GN-0777':{hl:'Photo kamaal ki chamakdaar hai. Gyarah saal se hila nahi.##Voter card wala lamp post. Jimmy ke dost khatam ho rahe hain.##Jinke peeche koi asli insaan nahi, aisi entries par Form 7 se aapatti ki ja sakti hai. Zameeni jaanch dekhti hai ki voter sach mein hain.',hi:'फ़ोटो कमाल की चमकदार है। ग्यारह साल से हिला नहीं।##मतदाता कार्ड वाला लैम्प पोस्ट। जिम्मी के दोस्त ख़त्म हो रहे हैं।##जिनके पीछे कोई असली इंसान नहीं, ऐसी प्रविष्टियों पर फ़ॉर्म 7 से आपत्ति की जा सकती है। ज़मीनी जाँच देखती है कि मतदाता सचमुच हैं।'},
 'Sheela Pandey|GN-0356':{hl:'Wo building 2016 mein gir gayi. Ab wo shehar ke doosri taraf rehti hain, rasid ke saath.##Imaandaar gadbad, koi villain nahi. Unka pata bas update nahi hua.##Usi nirvachan kshetra mein ghar badla? Form 8 se pata update hota hai. Doosre kshetra mein gaye? Wahan Form 6 bharo.',hi:'वह इमारत 2016 में गिरा दी गई थी। अब वे शहर के दूसरी तरफ़ रहती हैं, रसीदों के साथ।##ईमानदार गड़बड़, कोई खलनायक नहीं। उनका पता बस अपडेट नहीं हुआ।##उसी निर्वाचन क्षेत्र में घर बदला? फ़ॉर्म 8 से पता अपडेट होता है। दूसरे क्षेत्र में गए? वहाँ फ़ॉर्म 6 भरिए।'},
 'Raja Babu|GN-0021':{hl:'Roz paanch kilometre chalte hain aur raste mein har kisi ko parakhte hain.##Atthasi saal ke aur bilkul zinda. Sirf umar kuch saabit nahi karti.##Andaze se kabhi flag mat kijiye. Galti se naam hatne par kisi ka vote chheen jaata hai, isiliye jaanch zaroori hai.',hi:'रोज़ पाँच किलोमीटर चलते हैं और रास्ते में हर किसी को परखते हैं।##अट्ठासी साल के और बिल्कुल ज़िंदा। सिर्फ़ उम्र कुछ साबित नहीं करती।##अंदाज़े से कभी चिह्नित मत कीजिए। ग़लती से नाम हटने पर किसी का वोट छिन जाता है, इसीलिए जाँच ज़रूरी है।'},
 'Balwant Chauhan|GN-0912':{hl:'Bilkul villain jaisa dikhta hai. Hai retired daakiya.##Kaale chashme, badi moonch, poori tarah begunah. Shakal saboot nahi hoti.##Record dekhiye, shakal nahi. Asli voter ko galti se flag karne ke asli nateeje hote hain.',hi:'बिल्कुल खलनायक जैसा दिखता है। है सेवानिवृत्त डाकिया।##काले चश्मे, बड़ी मूँछ, पूरी तरह बेक़सूर। शक्ल सबूत नहीं होती।##रिकॉर्ड देखिए, शक्ल नहीं। असली मतदाता को ग़लती से चिह्नित करने के असली नतीजे होते हैं।'},
 'Anita Reddy|GN-1201':{hl:'Poori line ke liye snacks laayi.##Asli. Udaar bhi.##Unhe yaad rakhiye. Mega Scheme ko nakal pasand hai.',hi:'पूरी कतार के लिए नाश्ता लाईं।##असली। उदार भी।##उन्हें याद रखिए। महा-योजना को नक़ल पसंद है।'},
 'Putla Ram|GN-1344':{hl:'Chaar saal se hile nahi. Posture kamaal ka.##Voter card wala putla. Posture shaandaar, yogyata shoonya.##Bhoot entries ke peeche koi asli insaan nahi hota. Booth adhikariyon ki zameeni jaanch unhe pakadne mein madad karti hai.',hi:'चार साल से हिले नहीं। मुद्रा कमाल की।##मतदाता कार्ड वाला पुतला। मुद्रा शानदार, योग्यता शून्य।##भूत प्रविष्टियों के पीछे कोई असली इंसान नहीं होता। बूथ अधिकारियों की ज़मीनी जाँच उन्हें पकड़ने में मदद करती है।'},
 'Imran Qureshi|GN-0765':{hl:'Koi note nahi. Bas ek insaan jo vote dena aur samosa dhoondhna chahta hai.##Saadha, imaandaar aur bhookha. Yahan kuch galat nahi.##Zyadatar voter bilkul aise hi dikhte hain. Villain ko aapko shaki mat banane dijiye.',hi:'कोई नोट नहीं। बस एक इंसान जो वोट देना और समोसा ढूँढना चाहता है।##सीधा, ईमानदार और भूखा। यहाँ कुछ ग़लत नहीं।##ज़्यादातर मतदाता बिल्कुल ऐसे ही दिखते हैं। खलनायक को आपको शक्की मत बनाने दीजिए।'},
 'Anita Reddi|GN-1587':{hl:'Snacks nahi laayi. Shak ki baat.##Wahi chehra, ek akshar badla, snacks zero. Jimmy ka classic kaam.##Duplicate ka matlab ek insaan do baar vote de sakta hai, isiliye Form 7 aapattiyan hoti hain.',hi:'नाश्ता नहीं लाईं। शक की बात।##वही चेहरा, एक अक्षर बदला, नाश्ता शून्य। जिम्मी का क्लासिक काम।##दोहरी प्रविष्टि का मतलब एक इंसान दो बार वोट दे सकता है, इसीलिए फ़ॉर्म 7 की आपत्तियाँ होती हैं।'},
 'Hari Om Tiwari|GN-0033':{hl:'2018 mein mrityu praman patra jama hua, par list kabhi update nahi hui.##Saalon baad bhi list mein hain. Jimmy ko pichhadta register pasand hai.##Mrit voter ke baare mein koi bhi adhikariyon ko Form 7 se bata sakta hai. Mrityu praman patra jaanch mein madad karta hai.',hi:'2018 में मृत्यु प्रमाण पत्र जमा हुआ, पर सूची कभी अपडेट नहीं हुई।##सालों बाद भी सूची में हैं। जिम्मी को पिछड़ा हुआ रजिस्टर पसंद है।##मृत मतदाता के बारे में कोई भी अधिकारियों को फ़ॉर्म 7 से बता सकता है। मृत्यु प्रमाण पत्र जाँच में मदद करता है।'},
 'Meena Tiwari|GN-1440':{hl:'Hari Om ki poti. Wahi surname, wahi ghar, alag insaan.##Parivaar ke log surname aur pata saajha karte hain. Ye saamanya hai, shak ki baat nahi.##Saajha pata aur saajha surname duplicate nahi banata.',hi:'हरि ओम की पोती। वही उपनाम, वही घर, अलग इंसान।##परिवार के लोग उपनाम और पता साझा करते हैं। यह सामान्य है, शक की बात नहीं।##साझा पता और साझा उपनाम दोहरी प्रविष्टि नहीं बनाते।'},
 'Jagdish Nair|GN-0618':{hl:'Pichhle saal usi ward mein naye flat mein gaye. List mein abhi bhi purani jagah hai.##Wo shift ho gaye, list nahi. Kaagzi kaam, badmaashi nahi.##Apna pata Form 8 se update kijiye taaki aap sahi booth par vote dein.',hi:'पिछले साल उसी वार्ड में नए फ़्लैट में गए। सूची में अब भी पुरानी जगह है।##वे शिफ़्ट हो गए, सूची नहीं। काग़ज़ी काम, बदमाशी नहीं।##अपना पता फ़ॉर्म 8 से अपडेट कीजिए ताकि आप सही बूथ पर वोट दें।'},
 'Tanvi Bose|—':{hl:'Pichhle mahine 18 ki hui. Maa saath laayi. Maa thermos bhi laayi.##Bilkul naya voter, tayyar aur thermos ke saath.##Form 6 18 saal ke hone par list mein aane ka pehla kadam hai.',hi:'पिछले महीने 18 की हुईं। माँ साथ लाईं। माँ थर्मस भी लाईं।##बिल्कुल नया मतदाता, तैयार और थर्मस के साथ।##फ़ॉर्म 6 18 साल के होने पर सूची में आने का पहला क़दम है।'},
 'Gulab Chand|GN-2041':{hl:'Parivaar kehta hai saalon pehle guzar gaye. Park ki unki bench ab smarak hai.##Park se chale gaye, list mein abhi hain. Jimmy ko bharosa tha ki koi bench dekhne nahi jayega.##Mrityu praman patra se adhikari ko mrit voter ki entry par Form 7 aapatti jaanchne mein madad milti hai.',hi:'परिवार कहता है सालों पहले गुज़र गए। पार्क की उनकी बेंच अब स्मारक है।##पार्क से चले गए, सूची में अब भी हैं। जिम्मी को भरोसा था कि कोई बेंच देखने नहीं जाएगा।##मृत्यु प्रमाण पत्र से अधिकारी को मृत मतदाता की प्रविष्टि पर फ़ॉर्म 7 की आपत्ति जाँचने में मदद मिलती है।'},
 'Kheti Lal|GN-2088':{hl:'Bina shikayat baarish mein khade rehte hain. Kabhi chhutti nahi maangi.##Voter card wala ek aur putla. Mehnati, par voter nahi.##Bhoot entries ke peeche koi asli insaan nahi hota. Unpar Form 7 se aapatti hoti hai.',hi:'बिना शिकायत बारिश में खड़े रहते हैं। कभी छुट्टी नहीं माँगी।##मतदाता कार्ड वाला एक और पुतला। मेहनती, पर मतदाता नहीं।##भूत प्रविष्टियों के पीछे कोई असली इंसान नहीं होता। उन पर फ़ॉर्म 7 से आपत्ति होती है।'},
 'Jyoti Stambh|GN-2107':{hl:'Raat ko tez chamakta hai. Kabhi line mein nahi laga.##Voter card wala ek aur lamp post. Jimmy ki ek hi pasand hai.##Zameeni jaanch dekhti hai ki list ke log sach mein maujood hain.',hi:'रात को तेज़ चमकता है। कभी कतार में नहीं लगा।##मतदाता कार्ड वाला एक और लैम्प पोस्ट। जिम्मी की एक ही पसंद है।##ज़मीनी जाँच देखती है कि सूची के लोग सचमुच मौजूद हैं।'},
 'Kiran Sethi|GN-2290':{hl:'Akhbaar hamesha khade hokar padhte hain.##Asli voter. Chehra yaad rakhiye.##Photo aur rishtedaar ke naam duplicate pakadne ke sabse achhe sutra hain.',hi:'अख़बार हमेशा खड़े होकर पढ़ते हैं।##असली मतदाता। चेहरा याद रखिए।##फ़ोटो और संबंधी के नाम दोहरी प्रविष्टि पकड़ने के सबसे अच्छे सुराग हैं।'},
 'Kiran Sethi|GN-2711':{hl:'Ek topi aa gayi hai. Moonch bilkul wahi hai.##Wahi chehra, wahi pita, pate mein ek extra akshar aur nayi topi. Jimmy ne koshish ki.##Ek insaan, ek entry. Duplicate entries par Form 7 se aapatti ki jaati hai.',hi:'एक टोपी आ गई है। मूँछ बिल्कुल वही है।##वही चेहरा, वही पिता, पते में एक अतिरिक्त अक्षर और नई टोपी। जिम्मी ने कोशिश की।##एक इंसान, एक प्रविष्टि। दोहरी प्रविष्टियों पर फ़ॉर्म 7 से आपत्ति की जाती है।'},
 'Nisha Rao|GN-2150':{hl:'Cinema 2019 mein band ho gaya. Wo ab do kilometre door rehti hain aur popcorn ko yaad karti hain.##Imaandaar pate ki gadbad. Cinema chala gaya, entry reh gayi.##Usi nirvachan kshetra mein ghar badla? Form 8 se pata update hota hai.',hi:'सिनेमा 2019 में बंद हो गया। वे अब दो किलोमीटर दूर रहती हैं और पॉपकॉर्न को याद करती हैं।##ईमानदार पते की गड़बड़। सिनेमा चला गया, प्रविष्टि रह गई।##उसी निर्वाचन क्षेत्र में घर बदला? फ़ॉर्म 8 से पता अपडेट होता है।'},
 'Harpreet Gill|GN-2166':{hl:'Padhai poori ki, hostel chhoda, aur ab paas mein kiraye ke flat mein rehte hain. List abhi tak nahi badli.##Wo aage badh gaye, list nahi. Kaagzi kaam, badmaashi nahi.##Ghar badalne se list ki entries purani ho jaati hain. Form 8 ek hi kshetra ke andar ise theek karta hai.',hi:'पढ़ाई पूरी की, हॉस्टल छोड़ा, और अब पास में किराये के फ़्लैट में रहते हैं। सूची अब तक नहीं बदली।##वे आगे बढ़ गए, सूची नहीं। काग़ज़ी काम, बदमाशी नहीं।##घर बदलने से सूची की प्रविष्टियाँ पुरानी हो जाती हैं। फ़ॉर्म 8 एक ही क्षेत्र के भीतर इसे ठीक करता है।'},
 'Rohan Das|—':{hl:'Naukri ke liye doosre shehar se aaye. Ek paudha saath laaye.##Shehar mein naye aur abhi is list mein nahi. Paudha khoob phal-phool raha hai.##Doosre nirvachan kshetra mein jaane par jahan ab rehte hain wahan Form 6 bharna hota hai.',hi:'नौकरी के लिए दूसरे शहर से आए। एक पौधा साथ लाए।##शहर में नए और अभी इस सूची में नहीं। पौधा फल-फूल रहा है।##दूसरे निर्वाचन क्षेत्र में जाने पर जहाँ अब रहते हैं वहाँ फ़ॉर्म 6 भरना होता है।'},
 'Ishita Rane|—':{hl:'Abhi 18 ki hui hain. Ungli par syahi wali selfie ki practice kar rahi hain.##Yogya, utsahit aur abhi list mein nahi. Form 6 ka samay.##Form 6 online bhara ja sakta hai, daftar ki line mein lagne ki zaroorat nahi.',hi:'अभी 18 की हुई हैं। उँगली पर स्याही वाली सेल्फ़ी की प्रैक्टिस कर रही हैं।##योग्य, उत्साही और अभी सूची में नहीं। फ़ॉर्म 6 का समय।##फ़ॉर्म 6 ऑनलाइन भरा जा सकता है, दफ़्तर की कतार में लगने की ज़रूरत नहीं।'},
 'Zoya Ansari|GN-2201':{hl:'18wen janmdin par registration karaya aur sabko batati hain.##Registered, haazir aur garvit. Clear.##Registered voter polling se pehle online apna naam list mein dekh sakte hain.',hi:'18वें जन्मदिन पर पंजीकरण कराया और सबको बताती हैं।##पंजीकृत, हाज़िर और गर्वित। मंज़ूर।##पंजीकृत मतदाता मतदान से पहले ऑनलाइन अपना नाम सूची में देख सकते हैं।'},
 'Dr. Prakash Iyengar|GN-2230':{hl:'Card par nau degree likhi hain. Voter sirf ek.##Naam ke baad bahut saare akshar, par voter phir bhi ek hi.##Upaadhi aur degree duplicate nahi banate. Rishtedaar, umar aur photo dekhiye.',hi:'कार्ड पर नौ डिग्रियाँ लिखी हैं। मतदाता सिर्फ़ एक।##नाम के बाद बहुत सारे अक्षर, पर मतदाता फिर भी एक ही।##उपाधि और डिग्री दोहरी प्रविष्टि नहीं बनाते। संबंधी, उम्र और फ़ोटो देखिए।'},
 'Priya Nair|GN-2250':{hl:'Judwa behen hai. Bina poochhe bata degi.##Asli. Unki judwa agli hai.##Judwa logon ki kai details milti hain. Flag karne se pehle photo dekhiye.',hi:'जुड़वाँ बहन है। बिना पूछे बता देंगी।##असली। उनकी जुड़वाँ अगली है।##जुड़वाँ लोगों की कई जानकारियाँ मिलती हैं। चिह्नित करने से पहले फ़ोटो देखिए।'},
 'Riya Nair|GN-2251':{hl:'Priya ki judwa. Dono ek-doosre ke vaakya aur behas poori karti hain.##Judwa, duplicate nahi. Alag photo, alag insaan.##Wahi pata, wahi pita aur wahi umar phir bhi do asli log ho sakte hain.',hi:'प्रिया की जुड़वाँ। दोनों एक-दूसरे के वाक्य और बहस पूरी करती हैं।##जुड़वाँ, दोहरी प्रविष्टि नहीं। अलग फ़ोटो, अलग इंसान।##वही पता, वही पिता और वही उम्र फिर भी दो असली लोग हो सकते हैं।'}

 ['Jimmy\u2019s biggest scheme yet, and the clock is running. You have 15 seconds per voter, and faster answers earn bonus points.','Jimmy ki ab tak ki sabse badi scheme, aur ghadi chal rahi hai. Har voter ke liye 15 second hain, aur tez jawab par bonus points milte hain.','जिम्मी की अब तक की सबसे बड़ी योजना, और घड़ी चल रही है। हर मतदाता के लिए 15 सेकंड हैं, और जल्दी जवाब देने पर बोनस अंक मिलते हैं।'],

var MAP = {hl:{}, hi:{}};
TR.forEach(function(r){ MAP.hl[r[0]] = r[1]; MAP.hi[r[0]] = r[2]; });

function ruleTr(s){
  var m, hi = (lang === 'hi');
  if ((m = s.match(/^Voter (\d+) of (\d+)$/))) return (hi ? 'मतदाता ' : 'Voter ') + m[1] + ' / ' + m[2];
  if ((m = s.match(/^Level (\d) of 3: (.+)$/))) return (hi ? 'स्तर ' : 'Level ') + m[1] + ' / 3: ' + T(m[2]);
  if ((m = s.match(/^Level (\d) of 3$/))) return (hi ? 'स्तर ' : 'Level ') + m[1] + ' / 3';
  if ((m = s.match(/^Level (\d) complete$/))) return hi ? 'स्तर ' + m[1] + ' पूरा' : 'Level ' + m[1] + ' poora';
  if ((m = s.match(/^Streak (\d+)$/))) return (hi ? 'लगातार ' : 'Lagataar ') + m[1];
  if ((m = s.match(/^Roll so far \((\d+)\)$/))) return (hi ? 'अब तक की सूची (' : 'Ab tak ki list (') + m[1] + ')';
  if ((m = s.match(/^Daily Case File, (.+)$/))) return (hi ? 'दैनिक केस फ़ाइल, ' : 'Roz ki case file, ') + m[1];
  if ((m = s.match(/^This one was (.+)\.$/))) return (hi ? 'यह था: ' : 'Ye tha: ') + T(m[1]) + (hi ? '।' : '.');
  if ((m = s.match(/^File Form (\d)$/))) return hi ? 'फ़ॉर्म ' + m[1] + ' भरिए' : 'Form ' + m[1] + ' bharo';
  if ((m = s.match(/^(\d+) of (\d+) badges earned$/))) return hi ? m[2] + ' में से ' + m[1] + ' बैज मिले' : m[2] + ' me se ' + m[1] + ' badge mile';
  if ((m = s.match(/^(\d+) of (\d+)$/))) return hi ? m[2] + ' में से ' + m[1] : m[2] + ' me se ' + m[1];
  if ((m = s.match(/^score \(best (\d+)\)$/))) return (hi ? 'अंक (सर्वश्रेष्ठ ' : 'score (best ') + m[1] + ')';
  if ((m = s.match(/^(Water|Roads|Jobs|Schools): who has the best plan\?$/))) return T(m[1]) + (hi ? ': सबसे अच्छी योजना किसकी है?' : ': sabse achhi yojana kiski hai?');
  if ((m = s.match(/^You voted for (.+) on (.+)\.$/))) return hi ? 'आपने ' + T(m[2]) + ' के मुद्दे पर ' + T(m[1]) + ' को वोट दिया।' : 'Aapne ' + T(m[2]) + ' ke mudde par ' + T(m[1]) + ' ko vote diya.';
  if ((m = s.match(/^Promise meter: (\d) of 5$/))) return (hi ? 'वादा मीटर: 5 में से ' : 'Vaada meter: 5 me se ') + m[1];
  if ((m = s.match(/^\((\d) of 5\):$/))) return hi ? '(5 में से ' + m[1] + '):' : '(5 me se ' + m[1] + '):';
  if ((m = s.match(/^New disguise: (.+)$/))) return (hi ? 'नया भेस: ' : 'Naya bhes: ') + T(m[1]);
  if ((m = s.match(/^Badge unlocked: (.+)!$/))) return (hi ? 'बैज मिला: ' : 'Badge mila: ') + m[1].split(', ').map(T).join(', ') + '!';
  if (/points|Reputation \u22121/.test(s)){
    var o = s;
    o = o.replace(/Form (\d) filed\./, function(a, n){ return hi ? 'फ़ॉर्म ' + n + ' भर दिया।' : 'Form ' + n + ' bhar diya.'; });
    o = o.replace(/\+(\d+) points/, function(a, n){ return hi ? '+' + n + ' अंक' : '+' + n + ' points'; });
    o = o.replace(/\(stamp bonus \+(\d+)\)/, function(a, n){ return hi ? '(मुहर बोनस +' + n + ')' : '(stamp bonus +' + n + ')'; });
    o = o.replace(/, speed bonus included/, hi ? ', गति बोनस शामिल' : ', speed bonus shaamil');
    o = o.replace(/Reputation \u22121\./, hi ? 'साख −1।' : 'Saakh −1.');
    return o;
  }
  return null;
}
function T(s){
  if (lang === 'en') return s;
  var m = MAP[lang];
  if (m[s]) return m[s];
  var q = s.match(/^\u201C(.+)\u201D$/);
  if (q && m[q[1]]) return '\u201C' + m[q[1]] + '\u201D';
  return ruleTr(s) || s;
}
function cf(c, f){
  if (lang === 'en') return c[f];
  var r = CASEI[c.n + '|' + c.no];
  if (!r) return c[f];
  var parts = (lang === 'hl' ? r.hl : r.hi).split('##'), i = {note:0, line:1, fact:2}[f];
  return parts[i] || c[f];
}
function trNode(n){
  var orig = (n.__en !== undefined) ? n.__en : n.nodeValue;
  if (orig == null) return;
  var key = orig.trim(); if (!key) return;
  var out = (lang === 'en') ? key : T(key);
  if (n.__en === undefined && out === key) return;
  n.__en = orig;
  var val = orig.replace(key, function(){ return out; });
  if (n.nodeValue !== val) n.nodeValue = val;
}
function trTree(root){
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n;
  while ((n = w.nextNode())){ if (n.parentNode && /^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)) continue; trNode(n); }
}
function syncLang(){
  var b = $('lang'); b.textContent = LSHORT[lang]; b.setAttribute('aria-label', 'Language: ' + LFULL[lang]);
  document.documentElement.lang = (lang === 'hi') ? 'hi' : (lang === 'hl' ? 'hi-Latn' : 'en');
}
function setLang(l){
  lang = l; try { localStorage.setItem('vld-lang', l); } catch(e){}
  trTree(document.body); syncLang();
  if ($('panel').classList.contains('show') && S.cur){ $('card').innerHTML = cardHTML(S.cur); renderLedger(); }
}
function setupLangRow(){
  [].forEach.call(document.querySelectorAll('.langrow button'), function(b){
    b.setAttribute('aria-pressed', String(b.getAttribute('data-l') === lang));
    b.onclick = function(){ setLang(b.getAttribute('data-l')); setupLangRow(); };
  });
}

    function(){ $('go').onclick = function(){ showTut(0); }; $('daily').onclick = function(){ hideModal(); startDaily(); }; $('mday').onclick = function(){ hideModal(); startMatdaan(); }; $('badges').onclick = showBadges; setupLangRow(); });
}
function showTut(i){

    function(){ $('go').onclick = function(){ if (last){ hideModal(); startGame(); } else showTut(i+1); }; });
}

/* ---------- wire up ---------- */
$('actions').addEventListener('click', function(e){
  var b = e.target.closest('button[data-c]'); if (b) decide(b.getAttribute('data-c'));
});
$('ledgerBtn').addEventListener('click', function(){

});

new MutationObserver(function(muts){
  muts.forEach(function(mu){
    if (mu.type === 'characterData') trNode(mu.target);
    else [].forEach.call(mu.addedNodes, function(a){ if (a.nodeType === 3) trNode(a); else if (a.nodeType === 1) trTree(a); });
  });
}).observe(document.body, {childList:true, subtree:true, characterData:true});
$('lang').onclick = function(){ setLang(LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length]); setupLangRow(); };
syncLang(); if (lang !== 'en') trTree(document.body);
document.addEventListener('pointerdown', audioInit);
document.addEventListener('click', function(e){ if (e.target.closest && e.target.closest('.primary,.secondary,.issuebtn,.act')) sfx.tap(); });
function syncMute(){ var b = $('mute'); b.textContent = muted ? '\uD83D\uDD07' : '\uD83D\uDD0A'; b.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); }
$('mute').onclick = function(){ muted = !muted; try { localStorage.setItem('vld-muted', muted ? '1' : '0'); } catch(e){} syncMute(); if (!muted){ audioInit(); sfx.tap(); } };
syncMute();
if (GL) buildWorld();
else { var n = document.createElement('p'); n.className = 'nogl'; n.textContent = 'Your browser could not start 3D graphics, so the town scene is hidden. The game still works.'; document.body.appendChild(n); }
stage.setLevel(1); updateHUD();
requestAnimationFrame(function(t){ last = t; loop(t); });
showTitle();
})();
